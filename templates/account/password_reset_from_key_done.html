{% extends 'the_cauldron/auth/_base.html' %}
{% load i18n %}

{% block auth_title %}{% trans "Password changed" %}{% endblock %}

{% block auth_card %}
<h1 class="forge-title">{% trans "Password changed" %}</h1>
<p class="forge-subtitle">{% trans "Your new password is set. Sign in with it." %}</p>
<form method="get" action="{% url 'the_cauldron:login' %}" class="forge-form">
  <button type="submit" class="btn-cauldron btn-cauldron--primary">{% trans "Sign in" %}</button>
</form>
{% endblock %}
